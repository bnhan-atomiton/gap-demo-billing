# Alembic configuration.
#
# Deliberately no `sqlalchemy.url`: the DSN is a credential and this file is in
# the repository. `migrations/env.py` reads it from `app.settings`, which
# supports the `DATABASE_URL_FILE` form a Docker secret arrives as.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
