# billing — generated by the AutoDeployer Factory from `ir.json`.
#
# The name is PEP 503 normalised because `uv.lock` records the normalised form
# and compares it: the two files disagreeing means every `uv sync --frozen`
# fails, inside the image build, with a staleness error that says nothing about
# the actual cause.

[project]
name = "billing"
version = "0.1.0"
description = "Customer billing: plans, invoices, line items, payments"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    # Plain, not `uvicorn[standard]`. The extra pulls uvloop, httptools,
    # websockets, watchfiles and python-dotenv; this app opens no websocket,
    # watches no files and reads no dotenv, so four of the five are dependencies
    # to patch rather than to use. Add the extra if you measure a reason to.
    "uvicorn>=0.34",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    # `[binary]` ships a compiled libpq, so the image needs no build toolchain
    # and no `libpq-dev` at runtime.
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    # `fastapi.testclient` is a thin wrapper over httpx; without it every test in
    # `tests/` fails at import.
    "httpx>=0.28",
]

[tool.uv]
# Virtual project: this repo is run from its root, not installed into itself.
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "PTH", "RUF"]
